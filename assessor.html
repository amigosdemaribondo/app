<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meu Assessor">
<meta name="theme-color" content="#04060B">
<link rel="apple-touch-icon" href="assessor-icone.png">
<link rel="icon" href="assessor-icone.png">
<link rel="manifest" href="assessor.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Meu Assessor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,800;1,500;1,600&display=swap">
<style>
/* Layout: painel de comando escuro — frase do dia, placar e alerta no topo; agenda em linha do tempo com ações por atividade; abas fixas embaixo. */
:root{
  --bg:#04060B; --navy:#0A1428; --navy2:#0F1E3A; --navy3:#16294D; --ink:#EEF3FF; --muted:#93A3C4; --line:#1F3360;
  --gold:#F5C518; --gold-soft:rgba(245,197,24,.14); --red:#FF3B3B; --red-soft:rgba(255,59,59,.16); --green:#2FD07A; --green-soft:rgba(47,208,122,.15);
  --amber:#FF9F1C; --blue:#4D8DFF;
  --f-display:"Sora", "Segoe UI", system-ui, sans-serif; --f-body:"Inter", -apple-system, system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:radial-gradient(1200px 500px at 50% -200px, #0E2350 0%, var(--bg) 60%) fixed, var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(14px, env(safe-area-inset-left, 0px));padding-right:max(14px, env(safe-area-inset-right, 0px));padding-block:14px calc(150px + env(safe-area-inset-bottom, 0px))}
.app{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .08s ease, background .2s ease, border-color .2s ease}
button:active{transform:scale(.96)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.tnum{font-variant-numeric:tabular-nums}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
input[type="datetime-local"],input[type="date"],input[type="month"]{color-scheme:dark}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
.u{border-bottom:2px solid var(--gold);padding-bottom:1px}
.muted{color:var(--muted)}
.sm{font-size:12.5px}

/* topo */
.topo{display:flex;justify-content:space-between;align-items:center;gap:10px}
.marca{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--navy2);border:1.5px solid var(--gold);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:var(--gold);font-size:17px;box-shadow:0 3px 0 -1px var(--gold)}
.marca h1{font-size:19px;letter-spacing:.01em}
.marca small{display:block;color:var(--muted);font-size:12px}
.ibtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--navy);font-size:17px;display:grid;place-items:center;box-shadow:inset 0 -2px 0 var(--gold)}

/* frase */
.frase{background:linear-gradient(135deg,var(--navy2),var(--navy));border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.frase small{font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.frase p{margin:0;font-family:var(--f-display);font-size:17px;font-weight:600;line-height:1.35}

/* alerta */
.alerta{border-radius:14px;padding:12px 14px;background:var(--red);color:#fff;display:flex;gap:10px;align-items:center;font-weight:700;animation:pulsa 1.2s ease-in-out infinite}
.alerta b{font-family:var(--f-display);font-size:16px}
.alerta span{font-size:13px;font-weight:600;opacity:.95}
@keyframes pulsa{0%,100%{box-shadow:0 0 0 0 rgba(255,59,59,.55)}50%{box-shadow:0 0 0 8px rgba(255,59,59,0)}}

/* placar */
.placar{display:grid;grid-template-columns:104px 1fr;gap:12px;align-items:center;background:var(--navy);border:1px solid var(--line);border-radius:18px;padding:12px}
.ring{position:relative;width:104px;height:104px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c0{stroke:var(--navy3)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:24px}
.ring small{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-size:10px;color:var(--muted);font-weight:700}
.chips4{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.chipc{border-radius:12px;padding:8px 10px;background:var(--navy2);border:1px solid var(--line);text-align:left;display:flex;flex-direction:column;gap:1px}
.chipc b{font-family:var(--f-display);font-size:20px;line-height:1.1}
.chipc span{font-size:11.5px;font-weight:700;color:var(--muted)}
.chipc.feito b{color:var(--green)} .chipc.prazo b{color:var(--amber)} .chipc.nao b{color:var(--red)} .chipc.pend b{color:var(--gold)}
.chipc[aria-pressed="true"]{border-color:var(--gold);box-shadow:inset 0 -2px 0 var(--gold)}

/* dia */
.dianav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dianav h2{font-size:18px;text-align:center}
.dianav h2 small{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:600}
.dianav button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--navy);font-size:18px}
.linha{display:flex;gap:6px;flex-wrap:wrap}
.lbtn{border:1px solid var(--line);background:var(--navy);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;box-shadow:inset 0 -2px 0 var(--gold);display:inline-flex;gap:6px;align-items:center;text-decoration:none;color:var(--ink)}

/* atividades */
.tl{display:flex;flex-direction:column;gap:8px}
.at{background:var(--navy);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:9px;position:relative}
.at .cab{display:flex;gap:11px;align-items:flex-start}
.ico{width:42px;height:42px;flex:none;border-radius:12px;background:var(--navy2);display:grid;place-items:center;font-size:20px;border-bottom:2.5px solid var(--gold)}
.at .tx{min-width:0;flex:1}
.at .tx b{display:block;font-size:15.5px;font-weight:700}
.at .hora{font-family:var(--f-display);font-weight:700;font-size:13px;color:var(--gold)}
.at .tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;margin-left:4px;vertical-align:1px}
.tag.feito{background:var(--green-soft);color:var(--green)} .tag.prazo{background:rgba(255,159,28,.16);color:var(--amber)} .tag.nao{background:var(--red-soft);color:var(--red)}
.tag.agora{background:var(--red);color:#fff} .tag.plano{background:var(--gold-soft);color:var(--gold)} .tag.reag{background:rgba(77,141,255,.16);color:var(--blue)}
.at.st-feito{border-color:rgba(47,208,122,.45);background:linear-gradient(180deg, rgba(47,208,122,.07), var(--navy))}
.at.st-nao{border-color:rgba(255,59,59,.5)}
.at.st-agora{border-color:var(--red);box-shadow:0 0 0 2px var(--red) inset;animation:pulsa 1.4s ease-in-out infinite}
.at.st-chegando{border-color:var(--red)}
.at .ok{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;background:var(--green);color:#03140A;display:grid;place-items:center;font-weight:900}
.acts{display:grid;grid-template-columns:1.2fr 1fr auto;gap:6px}
.acts button{border-radius:11px;padding:9px 6px;font-weight:800;font-size:13.5px;border:1.5px solid var(--line);background:var(--navy2)}
.acts .bf{background:var(--green);border-color:var(--green);color:#03140A}
.acts .bp{border-color:var(--amber);color:var(--amber)}
.acts .bc{width:46px;border-color:var(--gold);color:var(--gold)}
.prazoF{display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:var(--navy2);border:1px dashed var(--amber);border-radius:12px;padding:8px}
.prazoF input{flex:1 1 170px}
.prazoF button{border-radius:10px;padding:9px 12px;font-weight:800;border:0;background:var(--amber);color:#1A0E00}
.foto{display:flex;gap:8px;align-items:center}
.foto img{width:56px;height:56px;object-fit:cover;border-radius:10px;border:1.5px solid var(--gold)}
.desfazer{border:0;background:none;color:var(--muted);font-size:12.5px;text-decoration:underline;padding:0;align-self:flex-start}

/* listas */
.bloco{background:var(--navy);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.bloco h3{font-size:15.5px;display:flex;align-items:center;gap:8px}
.bloco h3 em{font-style:normal;font-size:12px;font-weight:800;border-radius:999px;padding:1px 8px;background:var(--navy3);color:var(--muted)}
.li{display:flex;gap:10px;align-items:center;font-size:14px;padding:6px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .h{font-family:var(--f-display);font-weight:700;font-size:12.5px;width:46px;flex:none;color:var(--muted)}
.li span{flex:1;min-width:0}
.vazio{color:var(--muted);font-size:13px;margin:0}

/* barras por período */
.barras{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bp2{display:flex;flex-direction:column;gap:5px;background:var(--navy2);border-radius:12px;padding:9px 10px}
.bp2 span{font-size:12px;font-weight:700;color:var(--muted)}
.bp2 .tr{height:8px;border-radius:99px;background:var(--navy3);overflow:hidden}
.bp2 .tr i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .5s ease}
.bp2 b{font-family:var(--f-display);font-size:14px}

/* formulários / cards gerais */
.card{background:var(--navy);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h2{font-size:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.selos{display:flex;gap:6px;flex-wrap:wrap}
.selo{border-radius:999px;padding:7px 12px;font-size:13px;font-weight:800;border:1.5px solid var(--line);background:var(--navy2)}
.selo[aria-pressed="true"].imediato,.pill.imediato{background:var(--red);border-color:var(--red);color:#fff}
.selo[aria-pressed="true"].urgente,.pill.urgente{background:var(--amber);border-color:var(--amber);color:#1A0E00}
.selo[aria-pressed="true"].realizar,.pill.realizar{background:var(--blue);border-color:var(--blue);color:#fff}
.pill{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px}
.bprim{border:0;border-radius:12px;padding:12px;font-weight:800;background:var(--gold);color:#140F00;width:100%;font-size:15px}
.acao{display:flex;gap:10px;align-items:flex-start;background:var(--navy2);border:1px solid var(--line);border-radius:14px;padding:11px}
.acao.feita{opacity:.6}
.acao.feita b{text-decoration:line-through}
.acao .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.acao .ck{width:32px;height:32px;flex:none;border-radius:10px;border:2px solid var(--gold);background:transparent;font-weight:900;color:transparent}
.acao.feita .ck{background:var(--green);border-color:var(--green);color:#03140A}
.acao .del{border:0;background:none;color:var(--muted);font-size:16px;padding:4px}
.acao.vence{border-color:var(--red)}

/* objetivos */
.eixos{display:flex;flex-direction:column;gap:10px}
.eixo{background:var(--navy2);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.eixo .cab{display:flex;align-items:center;gap:10px}
.eixo .cab input{font-family:var(--f-display);font-weight:700;background:transparent;border:0;border-bottom:1.5px solid var(--gold);border-radius:0;padding:4px 0}
.eixo .pc{font-family:var(--f-display);font-weight:800;color:var(--gold);white-space:nowrap}
.trk{height:10px;border-radius:99px;background:var(--navy3);overflow:hidden}
.trk i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#FFE27A);border-radius:99px;transition:width .5s ease}
.meta{display:flex;gap:8px;align-items:center;font-size:14px}
.meta button.mk{width:26px;height:26px;flex:none;border-radius:8px;border:2px solid var(--gold);background:transparent;color:transparent;font-weight:900;font-size:13px}
.meta.ok button.mk{background:var(--green);border-color:var(--green);color:#03140A}
.meta.ok span{text-decoration:line-through;color:var(--muted)}
.meta span{flex:1;min-width:0}
.meta .x{border:0;background:none;color:var(--muted)}
.addm{display:flex;gap:6px}
.addm button{border:0;border-radius:10px;padding:0 14px;font-weight:800;background:var(--gold);color:#140F00}
.radar{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;align-items:end;height:120px;padding-top:6px}
.radar div{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.radar .c{width:100%;max-width:40px;background:var(--navy3);border-radius:8px 8px 4px 4px;height:84px;position:relative;overflow:hidden}
.radar .c i{position:absolute;left:0;right:0;bottom:0;background:var(--gold);border-radius:8px 8px 4px 4px;transition:height .5s ease}
.radar small{font-size:10.5px;color:var(--muted);font-weight:700;text-align:center;line-height:1.15;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.radar em{font-style:normal;font-size:11px;font-weight:800;color:var(--gold)}

/* referências */
.refs{display:flex;flex-direction:column;gap:10px}
.ref{background:var(--navy2);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ref .cab{display:flex;justify-content:space-between;gap:8px;align-items:center}
.ref b{font-family:var(--f-display);font-size:16px}
.ref a{color:var(--gold);word-break:break-all}
.galeria{display:flex;gap:6px;flex-wrap:wrap}
.galeria img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1.5px solid var(--gold)}
.sug{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.sug:last-child{border-bottom:0}

/* navegação inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(4,6,11,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:6px max(10px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px))}
.nav div{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.nav button{border:0;background:transparent;border-radius:12px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--muted)}
.nav button i{font-style:normal;font-size:20px;line-height:1.2;padding-bottom:2px;border-bottom:2px solid transparent}
.nav button[aria-selected="true"]{color:var(--ink)}
.nav button[aria-selected="true"] i{border-bottom-color:var(--gold)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom, 0px));z-index:30;background:var(--navy3);border:1px solid var(--gold);color:var(--ink);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;max-width:min(92vw,420px);text-align:center}
.estado{font-size:12px;color:var(--muted);text-align:center}

/* capa */
.capa{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.capa img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;max-width:none}
.capa::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(0,0,0,0) 30%, rgba(4,8,20,.55) 55%, rgba(4,6,11,.96) 85%)}
.capa .cx{position:relative;z-index:1;padding:0 max(24px, env(safe-area-inset-right, 0px)) calc(34px + env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px));max-width:560px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:14px;animation:sobe .9s ease both}
.capa .fr{font-family:"Playfair Display", Georgia, serif;font-style:italic;font-weight:500;font-size:clamp(26px, 7.5vw, 36px);line-height:1.18;color:#F6F1E4;margin:0;text-shadow:0 2px 18px rgba(0,0,0,.6)}
.capa .nm{font-family:"Playfair Display", Georgia, serif;font-weight:800;font-size:clamp(30px, 9vw, 44px);color:#fff;margin:0;line-height:1.05}
.capa .nm span{display:block;font-family:var(--f-body);font-style:normal;font-weight:700;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.capa .linha-ouro{width:64px;height:3px;background:var(--gold);border-radius:3px}
.bora{border:0;border-radius:16px;background:var(--gold);color:#120D00;font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:.06em;padding:18px;box-shadow:0 10px 30px rgba(245,197,24,.35), inset 0 -3px 0 rgba(0,0,0,.18)}
@keyframes sobe{from{opacity:.0;transform:translateY(18px)}to{opacity:1;transform:none}}
/* hoje: foco */
.foco{border-radius:20px;padding:16px;background:linear-gradient(160deg,#13306A,#0A1428);border:1.5px solid var(--gold);display:flex;flex-direction:column;gap:12px}
.foco.quente{border-color:var(--red);box-shadow:0 0 0 2px var(--red) inset;animation:pulsa 1.4s ease-in-out infinite}
.foco.done{flex-direction:row;align-items:center;gap:14px}
.foco .fz{font-size:38px}
.foco small{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--gold)}
.foco.quente small{color:#FF8A8A}
.foco b{display:block;font-family:var(--f-display);font-size:22px;line-height:1.2}
.foco p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.fcab{display:flex;gap:14px;align-items:center}
.fico{width:58px;height:58px;flex:none;border-radius:16px;background:rgba(255,255,255,.06);display:grid;place-items:center;font-size:30px;border-bottom:3px solid var(--gold)}
.facts{display:grid;grid-template-columns:1.4fr 1fr auto;gap:8px}
.fb{border:0;border-radius:14px;padding:15px 8px;font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.04em}
.fb.ok{background:var(--green);color:#03140A}.fb.pz{background:transparent;border:2px solid var(--amber);color:var(--amber)}.fb.ft{width:56px;background:transparent;border:2px solid var(--gold);color:var(--gold);font-size:20px}
.fprox{display:flex;flex-direction:column;gap:4px;border-top:1px dashed var(--line);padding-top:10px;font-size:13.5px;color:var(--muted)}
.fprox i{font-style:normal;font-family:var(--f-display);font-weight:700;color:var(--gold);margin-right:4px}
.rapidos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rapidos button{border:1px solid var(--line);background:var(--navy);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:700;line-height:1.15}
.rapidos i{font-style:normal;font-size:22px;border-bottom:2px solid var(--gold);padding-bottom:2px}
.xp{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--navy);border-radius:16px;padding:10px 12px}
.xpi{font-size:30px}.xpt{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}.xpt b{font-size:14px}.xpt small{font-size:12px;color:var(--muted)}
.pc{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.pc:last-child{border-bottom:0}
.pct{flex:1;min-width:0;display:flex;flex-direction:column}.pct small{color:var(--muted);font-size:12px}
.ico.sm2{width:34px;height:34px;font-size:17px}
.zap{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#1FAF5A;text-decoration:none;font-size:18px}
.mini{width:38px;height:38px;border-radius:12px;border:1.5px solid var(--gold);background:transparent;color:var(--gold);font-weight:900}
.toggle{border:1px dashed var(--gold);background:transparent;color:var(--gold);border-radius:14px;padding:12px;font-weight:800}
.sec{font-size:17px;margin:6px 2px 0}
/* metas */
.mw{background:var(--navy2);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.mw.done{border-color:rgba(47,208,122,.5)}
.mwc{display:flex;align-items:center;gap:10px}.mwc b{flex:1;min-width:0}.mwi{font-size:22px}.mwn{font-family:var(--f-display);font-weight:800;color:var(--gold)}
.mw.done .mwn{color:var(--green)}
.mwb{display:grid;grid-template-columns:48px 1fr 48px;gap:6px}
.mwb button{border:1.5px solid var(--line);background:var(--navy);border-radius:11px;padding:10px;font-weight:800;font-size:16px}
.mwb .mais{background:var(--gold);border-color:var(--gold);color:#140F00;font-size:15px}
.grid3{display:grid;grid-template-columns:1fr 70px 52px;gap:6px}
.icopick{display:flex;gap:4px;flex-wrap:wrap}
.icopick button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--navy2);font-size:18px}
.icopick button[aria-pressed="true"]{border-color:var(--gold);box-shadow:inset 0 -2px 0 var(--gold)}
.regras{display:flex;flex-direction:column;gap:5px;font-size:13.5px}.regras b{color:var(--gold)}
/* rede */
.redetop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bprim.slim{width:auto;padding:9px 14px}
.areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:6px}
.area{position:relative;border:1px solid var(--line);background:var(--navy2);border-radius:14px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;min-height:88px}
.area i{font-style:normal;font-size:24px;border-bottom:2px solid var(--gold);padding-bottom:2px;margin-bottom:2px}
.area b{font-size:11.5px;line-height:1.15}.area small{font-size:10px;color:var(--muted);line-height:1.1}
.area em{position:absolute;top:5px;right:6px;font-style:normal;font-size:10.5px;font-weight:800;background:var(--navy3);border-radius:99px;padding:0 6px;color:var(--gold)}
.area.on{border-color:var(--gold);background:var(--gold-soft)}
.funil{display:flex;flex-direction:column;gap:5px}
.funil div{display:grid;grid-template-columns:28px 1fr 110px;gap:8px;align-items:center;font-size:12.5px}
.funil div span{font-family:var(--f-display);font-weight:800;text-align:right}
.funil div i{height:9px;border-radius:99px;display:block}
.funil small{color:var(--muted);font-weight:600}
.contatos{display:flex;flex-direction:column;gap:8px}
.ct{background:var(--navy);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ctc{display:flex;gap:10px;align-items:center}.ctt{flex:1;min-width:0;display:flex;flex-direction:column}.ctt b{font-size:15.5px}.ctt small{color:var(--muted);font-size:12.5px}
.estrela{border:0;background:none;font-size:22px;padding:4px;color:var(--muted)}
.obj{font-size:13.5px;background:var(--navy2);border-radius:10px;padding:7px 10px}
.ctl{display:flex;justify-content:space-between;gap:8px;align-items:center}
.st{font-size:12px;font-weight:800;color:var(--c)}
.cta{display:flex;gap:6px;flex-wrap:wrap}.cta.col{flex-direction:column;align-items:stretch}
.form select{appearance:auto}
.chk{display:flex;gap:8px;align-items:center;font-size:14px}.chk input{width:auto}
/* mais */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{position:relative;border:1px solid var(--line);background:linear-gradient(160deg,var(--navy2),var(--navy));border-radius:18px;padding:16px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;min-height:120px}
.tile i{font-style:normal;font-size:30px;border-bottom:2.5px solid var(--gold);padding-bottom:3px;margin-bottom:4px}
.tile b{font-family:var(--f-display);font-size:16px}.tile small{color:var(--muted);font-size:12px}
.tile em{position:absolute;top:10px;right:12px;font-style:normal;font-weight:800;color:var(--gold);font-size:13px}
.voltar{border:0;background:none;color:var(--gold);font-weight:800;font-size:15px;padding:4px 0;align-self:flex-start}
.mic{width:96px;height:96px;border-radius:50%;border:3px solid var(--gold);background:var(--navy2);font-size:38px;align-self:center;color:var(--ink)}
.mic.on{background:var(--red);border-color:var(--red);color:#fff;animation:pulsa 1.2s ease-in-out infinite}
.parcial{margin:0;color:var(--muted);font-style:italic}
.lbtn.ia{border-color:var(--gold);color:var(--gold)}
.lbtn[disabled],.bprim[disabled]{opacity:.45}
.nota{display:flex;flex-direction:column;gap:4px;padding:8px 0;border-bottom:1px solid var(--line)}
.nota p{margin:0;font-size:14px;white-space:pre-wrap}
.iares h3{font-size:14.5px;margin-top:4px}.resumo{margin:0;font-size:15px;font-weight:600}
.sugs{display:flex;gap:6px;flex-wrap:wrap}
.iaout{white-space:pre-wrap;font-size:14.5px;line-height:1.5;background:var(--navy2);border-radius:12px;padding:12px;min-height:20px}
.iaout:empty{display:none}
ul.lista{margin:0;padding-left:18px}
.fab{position:fixed;right:max(16px, env(safe-area-inset-right, 0px));bottom:calc(84px + env(safe-area-inset-bottom, 0px));z-index:25;width:58px;height:58px;border-radius:50%;border:0;background:var(--gold);color:#140F00;font-size:26px;box-shadow:0 8px 24px rgba(245,197,24,.35)}
/* grave a rotina */
.ctgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ctb{border:1px solid var(--line);background:var(--navy2);border-radius:14px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px}
.ctb i{font-style:normal;font-size:22px}.ctb b{font-size:13.5px}.ctb small{font-size:11.5px;color:var(--muted)}.ctb em{font-style:normal;font-size:11px;font-weight:800;color:var(--gold)}
.ctb.on{background:var(--green-soft);border-color:var(--green)}.ctb.on b::before{content:"✓ ";color:var(--green)}
.ctb:last-child:nth-child(odd){grid-column:1/-1}
.finalert{display:flex;gap:12px;align-items:center;text-align:left;width:100%;border:1.5px solid var(--amber);background:rgba(255,159,28,.1);border-radius:16px;padding:11px 14px}
.finalert>span:first-child{font-size:26px}.finalert b{display:block;font-size:14px}.finalert small{color:var(--muted)}
.finalert.quente{border-color:var(--red);background:var(--red-soft);animation:pulsa 1.4s ease-in-out infinite}
.valor{font-family:var(--f-display);font-weight:800;color:var(--gold);white-space:nowrap}
.ct.finq{border-color:var(--red)}
.lbtn.okb{background:var(--green);border-color:var(--green);color:#03140A}
.diam{width:100%;text-align:left;border:2px solid #7FD8FF;border-radius:18px;padding:14px;background:linear-gradient(135deg,#0E2A55 0%,#0A1428 60%,#12305E 100%);box-shadow:0 0 0 1px rgba(127,216,255,.25) inset, 0 8px 28px rgba(77,170,255,.18);display:flex;flex-direction:column;gap:10px}
.diam.ok{border-color:var(--green)}
.dtop{display:flex;align-items:center;gap:12px}
.dico{font-size:36px;filter:drop-shadow(0 0 10px rgba(127,216,255,.7))}
.dtop small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.16em;color:#7FD8FF}
.dtop b{font-family:var(--f-display);font-size:22px;letter-spacing:.08em}
.dnum{margin-left:auto;font-family:var(--f-display);font-weight:800;font-size:24px;color:#BFEFFF}
.dnum i{font-style:normal;font-size:13px;color:var(--muted)}
.dtrk{position:relative;height:14px;border-radius:99px;background:var(--navy3);overflow:visible}
.dtrk>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),#7FD8FF);transition:width .6s ease}
.mk2{position:absolute;top:-6px;transform:translateX(-50%);font-size:14px}
.dinfo{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.dinfo b{color:var(--ink)}
.pinbox{position:fixed;inset:0;z-index:90;background:rgba(4,6,11,.88);display:grid;place-items:center;padding:20px}
.pinc{background:var(--navy);border:1.5px solid var(--gold);border-radius:20px;padding:22px;width:min(340px,100%);display:flex;flex-direction:column;gap:12px;text-align:center}
.pinc input{text-align:center;font-size:24px;letter-spacing:.4em}
[hidden]{display:none!important}
@media (max-width:380px){ .placar{grid-template-columns:88px 1fr} .ring{width:88px;height:88px} .acts{grid-template-columns:1fr 1fr auto} }
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- FINANCEIRO / PROGRAMAÇÃO DE PAGAMENTOS ---------- */
var CATS_FIN = ["ONG","Rádio","Política","Casa","Pessoal","Fornecedor","Outro"];
function finLista(){ return Object.keys(S.fin).map(function(id){ return Object.assign({id:id}, S.fin[id]); }); }
function finEstado(f){
  if (f.pago) return "pago";
  if (!f.venc) return "aberto";
  var d = f.venc.slice(0,10), h = hojeISO();
  if (d < h) return "atrasado";
  if (d === h) return "hoje";
  return diasDesde(d) >= -3 ? "breve" : "aberto";
}
function brl(v){ var n = Number(v) || 0; return n.toLocaleString("pt-BR", {style:"currency", currency:"BRL"}); }
function finAlertaHoje(){
  var L = finLista().filter(function(f){ var e = finEstado(f); return e === "atrasado" || e === "hoje" || e === "breve"; });
  if (!L.length) return "";
  var atr = L.filter(function(f){ return finEstado(f) === "atrasado"; }).length, hj = L.filter(function(f){ return finEstado(f) === "hoje"; }).length;
  var tot = L.reduce(function(s, f){ return s + (Number(f.valor) || 0); }, 0);
  return '<button class="finalert' + (atr || hj ? " quente" : "") + '" data-b="irFin"><span>💸</span><span><b>' + (atr ? atr + " atrasado(s) · " : "") + (hj ? hj + " vence(m) hoje · " : "") + L.length + ' pagamento(s) próximos</b><small>' + brl(tot) + ' · toque para ver</small></span></button>';
}
function renderFin(){
  var L = finLista(), ordem = {atrasado:0, hoje:1, breve:2, aberto:3, pago:4};
  L.sort(function(a,b){ return ordem[finEstado(a)] - ordem[finEstado(b)] || String(a.venc || "9").localeCompare(String(b.venc || "9")); });
  var ab = L.filter(function(f){ return !f.pago; }), pg = L.filter(function(f){ return f.pago; });
  var mes = hojeISO().slice(0,7), aPagar = ab.reduce(function(s, f){ return s + (Number(f.valor) || 0); }, 0);
  var pagoMes = pg.filter(function(f){ return String(f.pagoEm || "").slice(0,7) === mes; }).reduce(function(s, f){ return s + (Number(f.valor) || 0); }, 0);
  var atras = ab.filter(function(f){ return finEstado(f) === "atrasado"; });
  var e = S.editF || null;

  h += '<div class="card form"><h2 class="u" style="align-self:flex-start">' + (e && e.id ? "Editar pagamento" : "💰 Programar pagamento") + '</h2>'
    + '<input id="fDem" maxlength="120" placeholder="Demanda (o que é) *" value="' + esc(e ? e.demanda : "") + '">'
    + '<div class="grid2"><input id="fValor" inputmode="decimal" placeholder="Valor (R$)" value="' + esc(e && e.valor ? String(e.valor).replace(".", ",") : "") + '"><input id="fRec" maxlength="80" placeholder="Recebedor *" value="' + esc(e ? e.recebedor : "") + '"></div>'
    + '<div class="grid2"><label class="muted sm">Vencimento (data e hora do lembrete)<input type="datetime-local" id="fVenc" value="' + esc(e && e.venc ? e.venc : hojeISO() + "T09:00") + '"></label><label class="muted sm">Categoria<select id="fCat">' + CATS_FIN.map(function(c){ return '<option' + ((e && e.cat || "ONG") === c ? " selected" : "") + '>' + c + '</option>'; }).join("") + '</select></label></div>'
    + '<input id="fPix" maxlength="120" placeholder="Pix / conta / observação" value="' + esc(e ? e.pix || "" : "") + '">'
    + '<label class="chk"><input type="checkbox" id="fRep"' + (e && e.mensal ? " checked" : "") + '> 🔁 Repete todo mês (ao pagar, já agenda o próximo)</label>'
    + '<div class="grid2"><button class="bprim" data-b="salvaF">' + (e && e.id ? "Salvar" : "+ Programar") + '</button>' + (e ? '<button class="lbtn" data-b="cancelaF">Cancelar</button>' : '<span></span>') + '</div></div>';
  h += '<div class="contatos">' + (ab.length ? ab.map(cardFin).join("") : '<p class="vazio" style="text-align:center">Nenhum pagamento em aberto.</p>') + '</div>';
  if (pg.length) h += '<details class="card"><summary class="muted" style="cursor:pointer;font-weight:700">✅ Pagos (' + pg.length + ')</summary><div class="contatos">' + pg.slice(0, 40).map(cardFin).join("") + '</div></details>';
  return h;
}
function cardFin(f){
  var e = finEstado(f), tag = {pago:["var(--green)","Pago"], atrasado:["var(--red)","Atrasado"], hoje:["var(--red)","Vence hoje"], breve:["var(--amber)","Vence em breve"], aberto:["var(--gold)","Programado"]}[e];
  return '<div class="ct' + (e === "atrasado" || e === "hoje" ? " finq" : "") + '"><div class="ctc"><span class="ico">💸</span><div class="ctt"><b>' + esc(f.demanda) + '</b><small>para <b>' + esc(f.recebedor || "—") + '</b> · ' + esc(f.cat || "") + (f.mensal ? " · 🔁 mensal" : "") + '</small></div><span class="valor tnum">' + brl(f.valor) + '</span></div>'
    + '<div class="ctl"><span class="st" style="--c:' + tag[0] + '">● ' + tag[1] + '</span><span class="muted sm tnum">' + (f.venc ? fmtDT(f.venc) : "sem data") + (f.pago && f.pagoEm ? " · pago " + fmtD(f.pagoEm.slice(0,10)) : "") + '</span></div>'
    + (f.pix ? '<div class="obj">🏦 ' + esc(f.pix) + '</div>' : '')
    + (f.comp ? '<div class="foto"><img src="' + fotoSrc(f.comp) + '" alt="Comprovante"><span class="muted sm">Comprovante anexado</span></div>' : '')
    + '<div class="cta">' + (f.pago ? '<button class="lbtn" data-b="desfazF" data-id="' + esc(f.id) + '">↺ Desfazer</button>' : '<button class="lbtn okb" data-b="pagarF" data-id="' + esc(f.id) + '">✓ Pago</button>')
    + (ASSETS ? '<button class="lbtn" data-b="compF" data-id="' + esc(f.id) + '">📎 Comprovante</button>' : '') + '<button class="lbtn" data-b="editF" data-id="' + esc(f.id) + '">✏️</button><button class="lbtn" data-b="delF" data-id="' + esc(f.id) + '">🗑</button></div></div>';
}
function proxMes(dt){ var y = +dt.slice(0,4), m = +dt.slice(5,7) + 1, d = +dt.slice(8,10); if (m > 12){ m = 1; y++; } var ult = new Date(Date.UTC(y, m, 0)).getUTCDate(); return y + "-" + String(m).padStart(2,"0") + "-" + String(Math.min(d, ult)).padStart(2,"0") + dt.slice(10); }

    S.fin[fid] = Object.assign({}, ant, {demanda:dem, recebedor:rec, valor:val, venc:$("fVenc").value.slice(0,16), cat:$("fCat").value, pix:$("fPix").value.trim(), mensal:$("fRep").checked, pago:ant.pago || false, criado:ant.criado || agoraStamp()});
    gravar("financeiro", fid, S.fin[fid]); S.editF = null; SOM.play("feito"); toast("💰 Pagamento programado"); render(); return;
  }
  if (a === "pagarF"){
    var f = S.fin[id]; S.fin[id] = Object.assign({}, f, {pago:true, pagoEm:agoraStamp()}); gravar("financeiro", id, S.fin[id]);
    if (f.mensal && f.venc){ var nid = "f" + Date.now().toString(36); S.fin[nid] = Object.assign({}, f, {venc:proxMes(f.venc), pago:false, pagoEm:"", comp:"", criado:agoraStamp()}); gravar("financeiro", nid, S.fin[nid]); toast("✅ Pago. Próximo já agendado para " + fmtD(proxMes(f.venc).slice(0,10))); }
    else toast("✅ Pagamento registrado");

  if (a === "delF"){ if (b.dataset.sure !== "1"){ b.dataset.sure = "1"; b.textContent = "Excluir?"; return; } delete S.fin[id]; gravar("financeiro", id, null); render(); return; }
  if (a === "compF"){ fotoAlvo = "fin:" + id; $("refIn").click(); return; }
});

  if (S.view !== "hoje" || S.dia !== hojeISO()) { if (!document.activeElement || !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) render(); return; }
  var it = itensDoDia(hojeISO()), novo = false;
  it.forEach(function(x){ var e = estadoDe(x), k = hojeISO() + x.k + e; if ((e === "chegando" || e === "agora") && !S.alertados[k]){ S.alertados[k] = 1; novo = true; } });
  if (novo){ SOM.play("alerta"); if (document.hidden && window.Notification && Notification.permission === "granted"){ try { new Notification("Meu Assessor", {body:"Atividade chegando na hora."}); } catch(e){} } }

}

var API = "https://script.google.com/macros/s/AKfycbwLzuB3AAmSOr9GozIxPNYFpXR2KYhYqVzwbxU1NmbCYftjypv1icqmeTkc0gKUrFY1/exec";

/* voz do iPhone (reconhecimento de fala do navegador) */
(function(){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition; if (!SR) return;
  var rec = null, hp = [], hf = [], hs = [];
  DIT = {
    onPartial:function(f){ hp.push(f); }, onFinal:function(f){ hf.push(f); }, onState:function(f){ hs.push(f); },
    start:function(){ try { rec = new SR(); rec.lang = "pt-BR"; rec.continuous = true; rec.interimResults = true;
        rec.onresult = function(ev){ var par = ""; for (var i = ev.resultIndex; i < ev.results.length; i++){ var r = ev.results[i]; if (r.isFinal) hf.forEach(function(f){ f({text:r[0].transcript}); }); else par += r[0].transcript; } hp.forEach(function(f){ f({text:par}); }); };
        rec.onstart = function(){ hs.forEach(function(f){ f({state:"listening"}); }); };
        rec.onend = function(){ hs.forEach(function(f){ f({state:"idle"}); }); };
        rec.onerror = function(ev){ if (ev.error === "not-allowed") toast("Microfone bloqueado. Libere em Ajustes ou use o 🎤 do teclado."); };
        rec.start(); return Promise.resolve(); } catch(e){ return Promise.reject(e); } },
    stop:function(){ try { rec && rec.stop(); } catch(e){} return Promise.resolve(); }
  };
  DIT.onPartial(function(e){ gravParcial = e.text; var p = document.querySelector(".parcial"); if (p) p.textContent = e.text; else if (S.view === "mais" && S.sub === "grav") render(); });
  DIT.onFinal(function(e){ var cur = S.gravTexto || ""; S.gravTexto = (cur ? cur.replace(/\s+$/, "") + " " : "") + String(e.text || "").trim(); gravParcial = ""; if (S.view === "mais" && S.sub === "grav") render(); });
  DIT.onState(function(e){ gravAtivo = e.state === "listening"; if (!gravAtivo) gravParcial = ""; SOM.play(gravAtivo ? "foto" : "feito"); if (S.view === "mais" && S.sub === "grav") render(); });
})();
