<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meu Assessor">
<meta name="theme-color" content="#04060B">
<link rel="apple-touch-icon" href="assessor-icone.png">
<link rel="icon" href="assessor-icone.png">
<link rel="manifest" href="assessor.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Meu Assessor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,800;1,500;1,600&display=swap">
<style>
/* Layout: painel de comando escuro — frase do dia, placar e alerta no topo; agenda em linha do tempo com ações por atividade; abas fixas embaixo. */
:root{
  --bg:#04060B; --navy:#0A1428; --navy2:#0F1E3A; --navy3:#16294D; --ink:#EEF3FF; --muted:#93A3C4; --line:#1F3360; --field:#04060B;
  --gold:#F5C518; --gold-soft:rgba(245,197,24,.14); --red:#FF3B3B; --red-soft:rgba(255,59,59,.16); --green:#2FD07A; --green-soft:rgba(47,208,122,.15);
  --amber:#FF9F1C; --blue:#4D8DFF;
  --f-display:"Sora", "Segoe UI", system-ui, sans-serif; --f-body:"Inter", -apple-system, system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:radial-gradient(1200px 500px at 50% -200px, #0E2350 0%, var(--bg) 60%) fixed, var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(14px, env(safe-area-inset-left, 0px));padding-right:max(14px, env(safe-area-inset-right, 0px));padding-block:14px calc(150px + env(safe-area-inset-bottom, 0px))}
.app{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .08s ease, background .2s ease, border-color .2s ease}
button:active{transform:scale(.96)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.tnum{font-variant-numeric:tabular-nums}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
input[type="datetime-local"],input[type="date"],input[type="month"]{color-scheme:dark}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
.u{border-bottom:2px solid var(--gold);padding-bottom:1px}
.muted{color:var(--muted)}
.chipc span,.bp2 span{color:var(--muted)}
.sm{font-size:12.5px}

/* topo */
.topo{display:flex;justify-content:space-between;align-items:center;gap:10px}
.marca{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--navy2);border:1.5px solid var(--gold);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:var(--gold);font-size:17px;box-shadow:0 3px 0 -1px var(--gold)}
.marca h1{font-size:19px;letter-spacing:.01em}
.marca small{display:block;color:var(--muted);font-size:12px}
.ibtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--navy);font-size:17px;display:grid;place-items:center;box-shadow:inset 0 -2px 0 var(--gold)}

/* frase */
.frase{background:linear-gradient(135deg,var(--navy2),var(--navy));border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.frase small{font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.frase p{margin:0;font-family:var(--f-display);font-size:17px;font-weight:600;line-height:1.35}

/* alerta */
.alerta{border-radius:14px;padding:12px 14px;background:var(--red);color:#fff;display:flex;gap:10px;align-items:center;font-weight:700;animation:pulsa 1.2s ease-in-out infinite}
.alerta b{font-family:var(--f-display);font-size:16px}
.alerta span{font-size:13px;font-weight:600;opacity:.95}
@keyframes pulsa{0%,100%{box-shadow:0 0 0 0 rgba(255,59,59,.55)}50%{box-shadow:0 0 0 8px rgba(255,59,59,0)}}

/* placar */
.placar{display:grid;grid-template-columns:104px 1fr;gap:12px;align-items:center;background:var(--navy);border:1px solid var(--line);border-radius:18px;padding:12px}
.ring{position:relative;width:104px;height:104px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c0{stroke:var(--navy3)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:24px}
.ring small{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-size:10px;color:var(--muted);font-weight:700}
.chips4{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.chipc{border-radius:12px;padding:8px 10px;background:var(--navy2);border:1px solid var(--line);text-align:left;display:flex;flex-direction:column;gap:1px}
.chipc b{font-family:var(--f-display);font-size:20px;line-height:1.1}
.chipc span{font-size:11.5px;font-weight:700;color:var(--muted)}
.chipc.feito b{color:var(--green)} .chipc.prazo b{color:var(--amber)} .chipc.nao b{color:var(--red)} .chipc.pend b{color:var(--gold)}
.chipc[aria-pressed="true"]{border-color:var(--gold);box-shadow:inset 0 -2px 0 var(--gold)}

/* dia */
.dianav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dianav h2{font-size:18px;text-align:center}
.dianav h2 small{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:600}
.dianav button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--navy);font-size:18px}
.linha{display:flex;gap:6px;flex-wrap:wrap}
.lbtn{border:1px solid var(--line);background:var(--navy);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;box-shadow:inset 0 -2px 0 var(--gold);display:inline-flex;gap:6px;align-items:center;text-decoration:none;color:var(--ink)}

/* atividades */
.tl{display:flex;flex-direction:column;gap:8px}
.at{background:var(--navy);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:9px;position:relative}
.at .cab{display:flex;gap:11px;align-items:flex-start}
.ico{width:42px;height:42px;flex:none;border-radius:12px;background:var(--navy2);display:grid;place-items:center;font-size:20px;border-bottom:2.5px solid var(--gold)}
.at .tx{min-width:0;flex:1}
.at .tx b{display:block;font-size:15.5px;font-weight:700}
.at .hora{font-family:var(--f-display);font-weight:700;font-size:13px;color:var(--gold)}
.at .tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;margin-left:4px;vertical-align:1px}
.tag.feito{background:var(--green-soft);color:var(--green)} .tag.prazo{background:rgba(255,159,28,.16);color:var(--amber)} .tag.nao{background:var(--red-soft);color:var(--red)}
.tag.agora{background:var(--red);color:#fff} .tag.plano{background:var(--gold-soft);color:var(--gold)} .tag.reag{background:rgba(77,141,255,.16);color:var(--blue)}
.at.st-feito{border-color:rgba(47,208,122,.45);background:linear-gradient(180deg, rgba(47,208,122,.07), var(--navy))}
.at.st-nao{border-color:rgba(255,59,59,.5)}
.at.st-agora{border-color:var(--red);box-shadow:0 0 0 2px var(--red) inset;animation:pulsa 1.4s ease-in-out infinite}
.at.st-chegando{border-color:var(--red)}
.at .ok{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;background:var(--green);color:#03140A;display:grid;place-items:center;font-weight:900}
.acts{display:grid;grid-template-columns:1.2fr 1fr auto;gap:6px}
.acts button{border-radius:11px;padding:9px 6px;font-weight:800;font-size:13.5px;border:1.5px solid var(--line);background:var(--navy2)}
.acts .bf{background:var(--green);border-color:var(--green);color:#03140A}
.acts .bp{border-color:var(--amber);color:var(--amber)}
.acts .bc{width:46px;border-color:var(--gold);color:var(--gold)}
.prazoF{display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:var(--navy2);border:1px dashed var(--amber);border-radius:12px;padding:8px}
.prazoF input{flex:1 1 170px}
.prazoF button{border-radius:10px;padding:9px 12px;font-weight:800;border:0;background:var(--amber);color:#1A0E00}
.foto{display:flex;gap:8px;align-items:center}
.foto img{width:56px;height:56px;object-fit:cover;border-radius:10px;border:1.5px solid var(--gold)}
.desfazer{border:0;background:none;color:var(--muted);font-size:12.5px;text-decoration:underline;padding:0;align-self:flex-start}

/* listas */
.bloco{background:var(--navy);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.bloco h3{font-size:15.5px;display:flex;align-items:center;gap:8px}
.bloco h3 em{font-style:normal;font-size:12px;font-weight:800;border-radius:999px;padding:1px 8px;background:var(--navy3);color:var(--muted)}
.li{display:flex;gap:10px;align-items:center;font-size:14px;padding:6px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .h{font-family:var(--f-display);font-weight:700;font-size:12.5px;width:46px;flex:none;color:var(--muted)}
.li span{flex:1;min-width:0}
.vazio{color:var(--muted);font-size:13px;margin:0}

/* barras por período */
.barras{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bp2{display:flex;flex-direction:column;gap:5px;background:var(--navy2);border-radius:12px;padding:9px 10px}
.bp2 span{font-size:12px;font-weight:700;color:var(--muted)}
.bp2 .tr{height:8px;border-radius:99px;background:var(--navy3);overflow:hidden}
.bp2 .tr i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .5s ease}
.bp2 b{font-family:var(--f-display);font-size:14px}

/* formulários / cards gerais */
.card{background:var(--navy);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h2{font-size:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.selos{display:flex;gap:6px;flex-wrap:wrap}
.selo{border-radius:999px;padding:7px 12px;font-size:13px;font-weight:800;border:1.5px solid var(--line);background:var(--navy2)}
.selo[aria-pressed="true"].imediato,.pill.imediato{background:var(--red);border-color:var(--red);color:#fff}
.selo[aria-pressed="true"].urgente,.pill.urgente{background:var(--amber);border-color:var(--amber);color:#1A0E00}
.selo[aria-pressed="true"].realizar,.pill.realizar{background:var(--blue);border-color:var(--blue);color:#fff}
.pill{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px}
.bprim{border:0;border-radius:12px;padding:12px;font-weight:800;background:var(--gold);color:#140F00;width:100%;font-size:15px}
.acao{display:flex;gap:10px;align-items:flex-start;background:var(--navy2);border:1px solid var(--line);border-radius:14px;padding:11px}
.acao.feita{opacity:.6}
.acao.feita b{text-decoration:line-through}
.acao .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.acao .ck{width:32px;height:32px;flex:none;border-radius:10px;border:2px solid var(--gold);background:transparent;font-weight:900;color:transparent}
.acao.feita .ck{background:var(--green);border-color:var(--green);color:#03140A}
.acao .del{border:0;background:none;color:var(--muted);font-size:16px;padding:4px}
.acao.vence{border-color:var(--red)}

/* objetivos */
.eixos{display:flex;flex-direction:column;gap:10px}
.eixo{background:var(--navy2);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.eixo .cab{display:flex;align-items:center;gap:10px}
.eixo .cab input{font-family:var(--f-display);font-weight:700;background:transparent;border:0;border-bottom:1.5px solid var(--gold);border-radius:0;padding:4px 0}
.eixo .pc{font-family:var(--f-display);font-weight:800;color:var(--gold);white-space:nowrap}
.trk{height:10px;border-radius:99px;background:var(--navy3);overflow:hidden}
.trk i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#FFE27A);border-radius:99px;transition:width .5s ease}
.meta{display:flex;gap:8px;align-items:center;font-size:14px}
.meta button.mk{width:26px;height:26px;flex:none;border-radius:8px;border:2px solid var(--gold);background:transparent;color:transparent;font-weight:900;font-size:13px}
.meta.ok button.mk{background:var(--green);border-color:var(--green);color:#03140A}
.meta.ok span{text-decoration:line-through;color:var(--muted)}
.meta span{flex:1;min-width:0}
.meta .x{border:0;background:none;color:var(--muted)}
.addm{display:flex;gap:6px}
.addm button{border:0;border-radius:10px;padding:0 14px;font-weight:800;background:var(--gold);color:#140F00}
.radar{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;align-items:end;height:120px;padding-top:6px}
.radar div{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.radar .c{width:100%;max-width:40px;background:var(--navy3);border-radius:8px 8px 4px 4px;height:84px;position:relative;overflow:hidden}
.radar .c i{position:absolute;left:0;right:0;bottom:0;background:var(--gold);border-radius:8px 8px 4px 4px;transition:height .5s ease}
.radar small{font-size:10.5px;color:var(--muted);font-weight:700;text-align:center;line-height:1.15;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.radar em{font-style:normal;font-size:11px;font-weight:800;color:var(--gold)}

/* referências */
.refs{display:flex;flex-direction:column;gap:10px}
.ref{background:var(--navy2);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ref .cab{display:flex;justify-content:space-between;gap:8px;align-items:center}
.ref b{font-family:var(--f-display);font-size:16px}
.ref a{color:var(--gold);word-break:break-all}
.galeria{display:flex;gap:6px;flex-wrap:wrap}
.galeria img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1.5px solid var(--gold)}
.sug{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.sug:last-child{border-bottom:0}

/* navegação inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(4,6,11,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:6px max(10px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px))}
.nav div{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.nav button{border:0;background:transparent;border-radius:12px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--muted)}
.nav button i{font-style:normal;font-size:20px;line-height:1.2;padding-bottom:2px;border-bottom:2px solid transparent}
.nav button[aria-selected="true"]{color:var(--ink)}
.nav button[aria-selected="true"] i{border-bottom-color:var(--gold)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom, 0px));z-index:30;background:var(--navy3);border:1px solid var(--gold);color:var(--ink);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;max-width:min(92vw,420px);text-align:center}
.estado{font-size:12px;color:var(--muted);text-align:center}

/* capa */
.capa{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.capa img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;max-width:none}
.capa::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(0,0,0,0) 30%, rgba(4,8,20,.55) 55%, rgba(4,6,11,.96) 85%)}
.capa .cx{position:relative;z-index:1;padding:0 max(24px, env(safe-area-inset-right, 0px)) calc(34px + env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px));max-width:560px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:14px;animation:sobe .9s ease both}
.capa .fr{font-family:"Playfair Display", Georgia, serif;font-style:italic;font-weight:500;font-size:clamp(26px, 7.5vw, 36px);line-height:1.18;color:#F6F1E4;margin:0;text-shadow:0 2px 18px rgba(0,0,0,.6)}
.capa .nm{font-family:"Playfair Display", Georgia, serif;font-weight:800;font-size:clamp(30px, 9vw, 44px);color:#fff;margin:0;line-height:1.05}
.capa .nm span{display:block;font-family:var(--f-body);font-style:normal;font-weight:700;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.capa .linha-ouro{width:64px;height:3px;background:var(--gold);border-radius:3px}
.bora{border:0;border-radius:16px;background:var(--gold);color:#120D00;font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:.06em;padding:18px;box-shadow:0 10px 30px rgba(245,197,24,.35), inset 0 -3px 0 rgba(0,0,0,.18)}
@keyframes sobe{from{opacity:.0;transform:translateY(18px)}to{opacity:1;transform:none}}
/* hoje: foco */
.foco{border-radius:20px;padding:16px;background:linear-gradient(160deg,#13306A,#0A1428);border:1.5px solid var(--gold);display:flex;flex-direction:column;gap:12px}
.foco.quente{border-color:var(--red);box-shadow:0 0 0 2px var(--red) inset;animation:pulsa 1.4s ease-in-out infinite}
.foco.done{flex-direction:row;align-items:center;gap:14px}
.foco .fz{font-size:38px}
.foco small{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--gold)}
.foco.quente small{color:#FF8A8A}
.foco b{display:block;font-family:var(--f-display);font-size:22px;line-height:1.2}
.foco p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.fcab{display:flex;gap:14px;align-items:center}
.fico{width:58px;height:58px;flex:none;border-radius:16px;background:rgba(255,255,255,.06);display:grid;place-items:center;font-size:30px;border-bottom:3px solid var(--gold)}
.facts{display:grid;grid-template-columns:1.4fr 1fr auto;gap:8px}
.fb{border:0;border-radius:14px;padding:15px 8px;font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.04em}
.fb.ok{background:var(--green);color:#03140A}.fb.pz{background:transparent;border:2px solid var(--amber);color:var(--amber)}.fb.ft{width:56px;background:transparent;border:2px solid var(--gold);color:var(--gold);font-size:20px}
.fprox{display:flex;flex-direction:column;gap:4px;border-top:1px dashed var(--line);padding-top:10px;font-size:13.5px;color:var(--muted)}
.fprox i{font-style:normal;font-family:var(--f-display);font-weight:700;color:var(--gold);margin-right:4px}
.fsec{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:6px}
.fsec button,.acts2 button,.amini button,.tbt button,.pzr button{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:11px;padding:9px 6px;font-weight:800;font-size:13px}
.ftimer{border-color:var(--gold)!important;color:var(--gold)!important}
.ftimer.on{background:var(--gold)!important;color:#1B1400!important}
.acts2{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.acts2 button{flex:1}
.acts2 .bp{border-color:var(--amber);color:var(--amber)}
.amini{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.amini button{padding:6px 10px;font-size:12.5px}
.acao.desc{opacity:.55}
.acao.desc b{text-decoration:line-through}
.tag.desc{background:rgba(148,163,184,.2);color:var(--muted)}
.at.st-desc{opacity:.55}

function lerVcf(txt){
  var linhas = String(txt || "").replace(/\r\n[ \t]/g, "").replace(/\n[ \t]/g, "").split(/\r?\n/), out = [], c = null;
  linhas.forEach(function(l){
    if (/^BEGIN:VCARD/i.test(l)){ c = {nome:"", zap:"", funcao:""}; return; }
    if (/^END:VCARD/i.test(l)){ if (c && (c.nome || c.zap)) out.push(c); c = null; return; }
    if (!c) return;
    var i = l.indexOf(":"); if (i < 0) return;
    var k = l.slice(0, i).toUpperCase(), v = l.slice(i + 1).replace(/\\,/g, ",").replace(/\;/g, ";").trim();
    if (/QUOTED-PRINTABLE/.test(k)){ try { v = decodeURIComponent(v.replace(/=([0-9A-F]{2})/gi, "%$1")); } catch(e){} }
    if (/^FN\b/.test(k)) c.nome = v;
    else if (/^N\b/.test(k) && !c.nome){ var p = v.split(";"); c.nome = [p[1], p[2], p[0]].filter(Boolean).join(" ").trim(); }
    else if (/^(ITEM\d+\.)?TEL\b/.test(k)){ var num = v.replace(/[^\d+]/g, ""); if (num && (!c.zap || /CELL|WHATSAPP|IPHONE|MOBILE/.test(k))) c.zap = num; }
    else if (/^(TITLE|ORG)\b/.test(k) && !c.funcao) c.funcao = v.replace(/;+$/, "").replace(/;/g, " · ");
  });
  return out;
}
function lerListaTexto(txt){

    l = l.trim(); if (!l) return null;
    var m = l.match(/(\+?\d[\d\s().-]{7,}\d)/), zap = m ? m[1].replace(/[^\d+]/g, "") : "";
    var nome = (m ? l.replace(m[1], "") : l).replace(/[-–:;,|]+\s*$/,"").replace(/^\s*[-–:;,|]+/,"").replace(/\s{2,}/g, " ").trim();
    return nome || zap ? {nome:nome || zap, zap:zap, funcao:""} : null;
  }).filter(Boolean);
}
function soDig(z){ var d = String(z || "").replace(/\D/g, ""); return d.length > 11 && d.indexOf("55") === 0 ? d.slice(2) : d; }

/* ===== atualização automática: confere se há versão nova no GitHub e recarrega ===== */
var APP_VERSAO = "202611110034";
(function(){
  var checando = false;
  function ocupado(){ var el = document.activeElement; return !!(el && /INPUT|TEXTAREA|SELECT/.test(el.tagName)); }
  function checar(){
    if (checando || location.protocol === "file:") return; checando = true;
    fetch(location.pathname + "?nv=" + Date.now(), {cache:"no-store"}).then(function(r){ return r.ok ? r.text() : ""; }).then(function(txt){
      var m = txt.match(/APP_VERSAO = "(\d+)"/);
      if (m && m[1] !== APP_VERSAO && m[1] > APP_VERSAO){
        if (ocupado()) { setTimeout(checar, 20000); return; }
        try { sessionStorage.setItem("atualizou", m[1]); } catch(e){}
        var aviso = document.createElement("div"); aviso.textContent = "⬇️ Atualizando para a versão nova…";
        aviso.setAttribute("style", "position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:9999;background:#FFD23F;color:#1B1400;font-weight:800;padding:10px 16px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.3);font-family:system-ui,sans-serif");
        document.body.appendChild(aviso);
        setTimeout(function(){ location.replace(location.pathname + "?v=" + m[1]); }, 700);
      }
    }).catch(function(){}).finally(function(){ checando = false; });
  }
  setTimeout(checar, 1500);
  setInterval(function(){ if (!document.hidden) checar(); }, 5 * 60 * 1000);
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) checar(); });
  try { if (sessionStorage.getItem("atualizou")) { sessionStorage.removeItem("atualizou"); setTimeout(function(){ var t = document.createElement("div"); t.textContent = "✅ App atualizado"; t.setAttribute("style", "position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:9999;background:#3BE38A;color:#06301A;font-weight:800;padding:10px 16px;border-radius:12px;font-family:system-ui,sans-serif"); document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 2500); }, 600); } } catch(e){}
})();
</script>
