<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MKT Maribondo</title>
<meta name="theme-color" content="#FF6A00">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MKT Maribondo">
<link rel="apple-touch-icon" href="mkt-icon-180.png">
<link rel="icon" type="image/png" href="mkt-icon-180.png">
<link rel="manifest" href="mkt.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,75..151,300..1000&family=Fraunces:ital,opsz,wght@1,9..144,500..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#FF7A1A;--bg2:#F04F00;--onbg:#FFFFFF;--onbg2:rgba(255,255,255,.82);
  --sf:#FFFFFF;--sf2:#FFF6EF;--sf3:#FFEADB;--sf4:#FFDCC4;--ink:#1F1A17;--ink2:#6B615B;--ink3:#9A8F88;
  --pri:#E25300;--onpri:#FFFFFF;--pric:#FFDCC4;--onpric:#3B1500;--sec:#1F1A17;
  --ok:#11885A;--okc:#D5F5E5;--onokc:#053B24;--warn:#9A5B00;--warnc:#FFEBC7;--onwarnc:#3D2400;--err:#D3261B;--errc:#FDE2DE;--onerrc:#5C0B05;
  --line:rgba(31,26,23,.10);--line2:rgba(31,26,23,.18);--scrim:rgba(20,12,6,.45);
  --sh1:0 1px 2px rgba(60,30,10,.08),0 2px 8px rgba(60,30,10,.06);--sh2:0 2px 6px rgba(60,30,10,.10),0 10px 28px rgba(60,30,10,.12);
  --r-xs:8px;--r-s:12px;--r-m:16px;--r-l:24px;--r-xl:28px;--r-f:999px;
  --f:"Roboto Flex",-apple-system,"Segoe UI",system-ui,sans-serif;--fs:"Fraunces",Georgia,serif;
  --mola:cubic-bezier(.2,1.35,.35,1);--suave:cubic-bezier(.2,.8,.2,1);--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
:root[data-tema="escuro"]{--bg1:#1E1714;--bg2:#120E0C;--onbg:#FFF1E8;--onbg2:rgba(255,241,232,.75);--sf:#231D1A;--sf2:#191412;--sf3:#2E2622;--sf4:#3A302B;--ink:#F5EDE7;--ink2:#BFB3AB;--ink3:#8D827B;
  --pri:#FF8A3D;--onpri:#2A0E00;--pric:#5A2808;--onpric:#FFDCC4;--sec:#F5EDE7;--ok:#4BD596;--okc:#0F3D29;--onokc:#C9F7DF;--warn:#FFB95C;--warnc:#4A3000;--onwarnc:#FFE3B8;--err:#FF8A80;--errc:#5C1510;--onerrc:#FFDAD5;
  --line:rgba(255,241,232,.10);--line2:rgba(255,241,232,.18);--sh1:0 1px 2px rgba(0,0,0,.4);--sh2:0 8px 28px rgba(0,0,0,.5)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;font-family:var(--f);color:var(--ink);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;font-variation-settings:"opsz" 16}
body{background:linear-gradient(170deg,var(--bg1) 0%,var(--bg2) 60%) fixed;min-height:100vh;font-size:15px;font-weight:450}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
input,textarea,select{background:var(--sf2);border:1.5px solid var(--line2);border-radius:var(--r-s);padding:12px 14px;font-weight:500;color:var(--ink);width:100%;outline:none;transition:border-color .15s,box-shadow .15s,background .15s}
input:focus,textarea:focus,select:focus{border-color:var(--pri);background:var(--sf);box-shadow:0 0 0 4px color-mix(in srgb,var(--pri) 18%,transparent)}
textarea{resize:vertical;line-height:1.45}
h1,h2,h3,h4{margin:0;font-family:var(--f);font-weight:800;letter-spacing:-.01em;line-height:1.1;font-variation-settings:"wdth" 112,"opsz" 32}
a{color:inherit}
[hidden]{display:none!important}
.ms{font-family:"Material Symbols Rounded";font-weight:500;font-style:normal;font-size:22px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;-webkit-font-feature-settings:"liga";font-feature-settings:"liga";font-variation-settings:"FILL" 0,"wght" 500,"GRAD" 0,"opsz" 24;transition:font-variation-settings .25s var(--suave),transform .3s var(--mola);flex:none;overflow:hidden;width:1em}
.ms.f{font-variation-settings:"FILL" 1,"wght" 600,"GRAD" 0,"opsz" 24}
.ms svg{width:1em;height:1em;display:block;fill:currentColor}.ms{font-family:inherit!important}
/* topo */
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:calc(10px + var(--safe-t)) 16px 10px;color:var(--onbg);background:linear-gradient(180deg,var(--bg1),color-mix(in srgb,var(--bg1) 90%,transparent));backdrop-filter:saturate(1.3) blur(14px);-webkit-backdrop-filter:saturate(1.3) blur(14px)}
.logo{width:40px;height:40px;border-radius:14px;background:#140C07;display:grid;place-items:center;flex:none;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.logo canvas{width:32px;height:32px}
.tt{flex:1;min-width:0}.tt h1{font-size:17px;font-weight:900;letter-spacing:.02em;font-variation-settings:"wdth" 125,"opsz" 20;color:var(--onbg)}
.tt small{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--onbg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{width:8px;height:8px;border-radius:50%;background:#4BE39A;display:inline-block;flex:none;box-shadow:0 0 0 3px rgba(75,227,154,.25)}.sync.off{background:#FFD0C8;box-shadow:none}.sync.gira{background:#FFE08A;animation:pisca 1s infinite}
@keyframes pisca{50%{opacity:.3}}
.ib{width:40px;height:40px;border-radius:var(--r-f);border:0;background:rgba(255,255,255,.18);color:var(--onbg);display:grid;place-items:center;flex:none;position:relative;overflow:hidden}
.ib:active{transform:scale(.92)}
.sos{width:auto;padding:0 12px;gap:4px;display:inline-flex;align-items:center;font-weight:900;font-size:12.5px;letter-spacing:.06em;background:#fff;color:var(--err)}
.meAv{width:40px;height:40px;border-radius:50%;border:2px solid rgba(255,255,255,.7);overflow:hidden;flex:none;padding:0;background:#fff}
.focoP{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:var(--r-f);background:#140C07;color:#fff;padding:7px 12px 7px 9px;font-weight:800;font-size:13px;font-variant-numeric:tabular-nums;max-width:44vw;box-shadow:0 4px 14px rgba(0,0,0,.25);animation:entra .4s var(--mola)}
.focoP span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* área de conteúdo: folha clara sobre o laranja */
main{position:relative;margin:4px 0 0;padding:18px 16px calc(120px + var(--safe-b));background:var(--sf2);border-radius:var(--r-xl) var(--r-xl) 0 0;min-height:calc(100vh - 70px);display:flex;flex-direction:column;gap:14px;box-shadow:0 -6px 24px rgba(60,20,0,.12)}
main > *{max-width:760px;width:100%;margin-left:auto;margin-right:auto}
main.quadro > .board{max-width:none}
main.troca{animation:vista .32s var(--suave)}
@keyframes vista{from{opacity:0;transform:translateY(10px)}}
.hero{color:var(--onbg);padding:2px 16px 14px;max-width:760px;margin:0 auto}
/* navegação (M3) */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:color-mix(in srgb,var(--sf) 94%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:8px 6px calc(8px + var(--safe-b));border-top:1px solid var(--line)}
.nav div{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:0}
.nav button{position:relative;border:0;background:transparent;color:var(--ink2);padding:2px 0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:700;letter-spacing:.01em}
.nav .pill{width:56px;height:32px;border-radius:var(--r-f);display:grid;place-items:center;transition:background .3s var(--suave),width .35s var(--mola)}
.nav button[aria-selected="true"]{color:var(--ink);font-weight:900}
.nav button[aria-selected="true"] .pill{background:var(--pric);width:62px}
.nav button[aria-selected="true"] .ms{font-variation-settings:"FILL" 1,"wght" 650,"GRAD" 0,"opsz" 24;color:var(--onpric);transform:scale(1.08)}
.bdg{position:absolute;top:-2px;left:calc(50% + 8px);min-width:18px;height:18px;border-radius:9px;background:var(--err);color:#fff;font-size:10.5px;font-weight:900;display:grid;place-items:center;padding:0 5px;border:2px solid var(--sf);font-style:normal}
/* FAB captura */
.fab{position:fixed;right:16px;bottom:calc(86px + var(--safe-b));z-index:45;height:56px;border:0;border-radius:var(--r-m);background:var(--pric);color:var(--onpric);display:inline-flex;align-items:center;gap:8px;padding:0 20px 0 16px;font-weight:900;font-size:15px;box-shadow:var(--sh2);transition:transform .2s var(--mola),padding .3s}
.fab:active{transform:scale(.94)}
.fab .ms{font-size:24px}
/* blocos e componentes */
.blk{background:var(--sf);border-radius:var(--r-l);padding:16px;box-shadow:var(--sh1);display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);animation:entra .45s var(--mola) both}
.blk.esc{background:#140C07;color:#FFF1E8;border-color:#140C07}
.blk h2{font-size:19px}.blk h3{font-size:15.5px}
@keyframes entra{from{opacity:0;transform:translateY(8px) scale(.985)}}
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hd h2,.hd h3{display:flex;align-items:center;gap:8px}
.mut{color:var(--ink2);font-size:13px;font-weight:500;margin:0;line-height:1.4}
.blk.esc .mut{color:rgba(255,241,232,.7)}
.vazio{margin:0;text-align:center;font-weight:600;color:var(--ink2);padding:14px 8px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bt{position:relative;overflow:hidden;border:1.5px solid var(--line2);background:transparent;color:var(--ink);border-radius:var(--r-f);min-height:40px;padding:8px 16px;font-weight:800;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;transition:transform .15s var(--mola),background .2s,box-shadow .2s;letter-spacing:.01em}
.bt:active{transform:scale(.96)}
.bt .ms{font-size:19px}
.bt.pr{background:var(--pri);color:var(--onpri);border-color:transparent;box-shadow:var(--sh1)}
.bt.ton{background:var(--pric);color:var(--onpric);border-color:transparent}
.bt.ok{background:var(--ok);color:#fff;border-color:transparent}.bt.bad{background:var(--errc);color:var(--onerrc);border-color:transparent}.bt.am{background:var(--warnc);color:var(--onwarnc);border-color:transparent}
.bt.zap{background:#25D366;color:#053B1D;border-color:transparent}
.bt.big{min-height:52px;font-size:16px;width:100%;border-radius:var(--r-m)}
.bt.sm{min-height:32px;padding:4px 12px;font-size:12.5px}
.bt[disabled]{opacity:.45;pointer-events:none}
.onda{position:absolute;border-radius:50%;background:currentColor;opacity:.18;transform:scale(0);animation:onda .55s var(--suave) forwards;pointer-events:none}
@keyframes onda{to{transform:scale(2.6);opacity:0}}
.chip{border:1.5px solid var(--line2);background:var(--sf);color:var(--ink);border-radius:var(--r-xs);height:34px;padding:0 12px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:background .2s,border-color .2s}
.chip .ms{font-size:18px}
.chip[aria-pressed="true"]{background:var(--pric);border-color:transparent;color:var(--onpric)}
.chip[aria-pressed="true"]::before{content:"✓";font-weight:900;font-size:14px;margin-left:-2px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px}.chips::-webkit-scrollbar{display:none}
.av{width:34px;height:34px;border-radius:50%;background:var(--c,#333);color:#fff;display:inline-grid;place-items:center;font-weight:900;font-size:13px;overflow:hidden;flex:none;box-shadow:0 0 0 2px var(--sf)}
.av img{width:100%;height:100%;object-fit:cover}
.av.g{width:52px;height:52px;font-size:19px}.av.p{width:24px;height:24px;font-size:10px}
.avs{display:flex}.avs .av{margin-left:-7px}.avs .av:first-child{margin-left:0}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;letter-spacing:.02em;border-radius:var(--r-xs);padding:3px 8px;background:color-mix(in srgb,var(--tc,#555) 14%,var(--sf));color:color-mix(in srgb,var(--tc,#555) 80%,var(--ink));white-space:nowrap}
.cd{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;border-radius:var(--r-xs);padding:3px 8px;background:var(--sf3);color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.cd.perto{background:var(--pric);color:var(--onpric)}.cd.atr{background:var(--warnc);color:var(--onwarnc)}.cd.ok{background:var(--okc);color:var(--onokc)}
/* snackbar */
.toast{position:fixed;left:50%;bottom:calc(156px + var(--safe-b));transform:translateX(-50%);z-index:300;background:#2B2420;color:#FFF1E8;border-radius:var(--r-s);padding:12px 14px 12px 16px;font-weight:600;font-size:14px;max-width:min(92vw,560px);width:max-content;display:flex;align-items:center;gap:14px;box-shadow:var(--sh2);animation:sobe .35s var(--mola)}
.toast button{border:0;background:transparent;color:#FFB68A;font-weight:900;font-size:14px;padding:4px 6px;pointer-events:auto}
@keyframes sobe{from{opacity:0;transform:translate(-50%,16px) scale(.96)}}
/* hoje */
.saud{font-family:var(--fs);font-style:italic;font-weight:700;font-size:34px;line-height:1.05;letter-spacing:-.02em;color:var(--onbg);font-variation-settings:"opsz" 96}
.dataH{font-size:13px;font-weight:700;color:var(--onbg2);letter-spacing:.04em;text-transform:uppercase;margin-top:6px}
.hoje1{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.anel{width:76px;height:76px;position:relative;display:grid;place-items:center}
.anel svg{position:absolute;inset:0;transform:rotate(-90deg)}.anel b{font-size:20px;font-weight:900;color:var(--onbg);font-variation-settings:"wdth" 110}.anel small{position:absolute;bottom:-16px;font-size:10.5px;font-weight:800;color:var(--onbg2);white-space:nowrap}
.cap{display:flex;align-items:center;gap:10px;background:var(--sf);border:1px solid var(--line);border-radius:var(--r-f);padding:6px 6px 6px 16px;box-shadow:var(--sh1);color:var(--ink2);font-weight:600;cursor:text;width:100%}
.cap span.t{flex:1;text-align:left}.cap .mic{width:40px;height:40px;border-radius:50%;border:0;background:var(--pric);color:var(--onpric);display:grid;place-items:center}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{position:relative;overflow:hidden;background:var(--sf);border:1px solid var(--line);border-radius:var(--r-m);padding:12px;display:flex;flex-direction:column;gap:2px;text-align:left;box-shadow:var(--sh1)}
.kpi b{font-size:30px;line-height:1;font-weight:900;font-variation-settings:"wdth" 120,"opsz" 48;font-variant-numeric:tabular-nums}
.kpi small{font-size:11.5px;font-weight:800;color:var(--ink2);letter-spacing:.02em}
.kpi.am{background:var(--warnc)}.kpi.am small{color:var(--onwarnc)}.kpi.pr{background:var(--pric)}.kpi.pr small{color:var(--onpric)}
.agora{background:#140C07;color:#FFF1E8;border-radius:var(--r-xl);padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--sh2);position:relative;overflow:hidden;animation:entra .5s var(--mola) both}
.agora::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,122,26,.55),transparent 70%);pointer-events:none}
.agora .lab2{font-size:11.5px;font-weight:900;letter-spacing:.12em;color:#FFB68A;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.agora h3{font-size:22px;font-variation-settings:"wdth" 118,"opsz" 40;line-height:1.15}
.agora .bt{border-color:rgba(255,241,232,.25);color:#FFF1E8}.agora .bt.pr{background:#FF7A1A;color:#1A0A00}
.alerta{background:var(--warnc);color:var(--onwarnc);border-radius:var(--r-l);padding:14px 16px;display:flex;flex-direction:column;gap:8px;border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);animation:entra .45s var(--mola) both}
.alerta b{display:flex;align-items:center;gap:8px;font-size:15px}
.linha{position:relative;display:flex;flex-direction:column;gap:2px}
.it{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px;border:0;border-radius:var(--r-m);background:transparent;text-align:left;width:100%;color:var(--ink);transition:background .15s}
.it:hover,.it:active{background:var(--sf3)}
.it .tt2{display:flex;flex-direction:column;gap:4px;min-width:0}.it b{font-size:14.5px;font-weight:750;line-height:1.25}.it small{font-size:12px;color:var(--ink2)}
.hr{font-size:13px;font-weight:900;min-width:46px;text-align:center;font-variant-numeric:tabular-nums;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:2px}
.hr i{width:10px;height:10px;border-radius:50%;background:var(--tc,var(--pri));box-shadow:0 0 0 4px color-mix(in srgb,var(--tc,var(--pri)) 20%,transparent)}
.mural{display:flex;flex-direction:column}
.mh{font-size:11.5px;font-weight:900;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase;margin:10px 0 4px}
.mi{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.4}
.mi small{color:var(--ink3);font-size:11.5px;font-weight:700}
.mi.al{background:var(--warnc);border-radius:var(--r-s);padding:8px;border:0;margin:2px 0}
.vis{font-size:11.5px;font-weight:800;color:var(--ok)}
/* quadro */
.qbar{display:flex;flex-direction:column;gap:6px}
.board{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 16px 24px;margin:0 -16px;scrollbar-width:none;align-items:flex-start;min-height:60vh}
.board::-webkit-scrollbar{display:none}
.col{flex:0 0 min(82vw,320px);scroll-snap-align:center;background:var(--sf3);border-radius:var(--r-l);padding:10px;display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 250px)}
.colh{display:flex;align-items:center;gap:8px;padding:4px 4px 2px}
.colh h3{font-size:14.5px;flex:1;display:flex;align-items:center;gap:6px;font-variation-settings:"wdth" 110}
.colh em{font-style:normal;background:var(--sf);color:var(--ink);border-radius:var(--r-f);padding:2px 9px;font-weight:900;font-size:12.5px}
.colh button{border:0;background:var(--sf);border-radius:var(--r-s);width:34px;height:34px;display:grid;place-items:center;color:var(--ink)}
.cards{display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:60px;padding:2px;scrollbar-width:none;border-radius:var(--r-m);transition:background .2s}
.cards::-webkit-scrollbar{display:none}
.cards.sobre{background:color-mix(in srgb,var(--pri) 14%,transparent);outline:2px dashed var(--pri);outline-offset:-2px}
.card{position:relative;background:var(--sf);border-radius:var(--r-m);padding:12px 12px 10px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--sh1);touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .2s var(--mola),box-shadow .2s;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tc,var(--pri))}
.card:active{transform:scale(.985)}
.card.atr{background:color-mix(in srgb,var(--warnc) 55%,var(--sf))}
.card .capa{width:calc(100% + 26px);margin:-12px -12px 0 -14px;height:128px;object-fit:cover;background:var(--sf3)}
.card b.ti{font-size:14.5px;line-height:1.25;font-weight:750}
.card .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card .rodape{display:flex;align-items:center;justify-content:space-between;gap:6px}
.card .ic{font-size:12px;font-weight:800;color:var(--ink2);display:inline-flex;gap:8px;align-items:center}.card .ic span{display:inline-flex;align-items:center;gap:2px}.card .ic .ms{font-size:16px}
.card.ergue{transform:rotate(-2.5deg) scale(1.05);box-shadow:0 24px 48px rgba(40,15,0,.35);z-index:200;position:fixed;pointer-events:none;margin:0;transition:none}
.card.fant{opacity:.3}
.slot{height:56px;border-radius:var(--r-m);background:color-mix(in srgb,var(--pri) 12%,transparent);border:2px dashed var(--pri);flex:none}

/* ===== atualização automática: confere se há versão nova no GitHub e recarrega ===== */
var APP_VERSAO = "202611110408";
(function(){
  var checando = false;
  function ocupado(){ var el = document.activeElement; return !!(el && /INPUT|TEXTAREA|SELECT/.test(el.tagName)); }
  function checar(){
    if (checando || location.protocol === "file:") return; checando = true;
    fetch(location.pathname + "?nv=" + Date.now(), {cache:"no-store"}).then(function(r){ return r.ok ? r.text() : ""; }).then(function(txt){
      var m = txt.match(/APP_VERSAO = "(\d+)"/);
      if (m && m[1] !== APP_VERSAO && m[1] > APP_VERSAO){
        if (ocupado()) { setTimeout(checar, 20000); return; }
        try { sessionStorage.setItem("atualizou", m[1]); } catch(e){}
        var aviso = document.createElement("div"); aviso.textContent = "⬇️ Atualizando para a versão nova…";
        aviso.setAttribute("style", "position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:9999;background:#FFD23F;color:#1B1400;font-weight:800;padding:10px 16px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.3);font-family:system-ui,sans-serif");
        document.body.appendChild(aviso);
        setTimeout(function(){ location.replace(location.pathname + "?v=" + m[1]); }, 700);
      }
    }).catch(function(){}).finally(function(){ checando = false; });
  }
  setTimeout(checar, 1500);
  setInterval(function(){ if (!document.hidden) checar(); }, 5 * 60 * 1000);
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) checar(); });
  try { if (sessionStorage.getItem("atualizou")) { sessionStorage.removeItem("atualizou"); setTimeout(function(){ var t = document.createElement("div"); t.textContent = "✅ App atualizado"; t.setAttribute("style", "position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:9999;background:#3BE38A;color:#06301A;font-weight:800;padding:10px 16px;border-radius:12px;font-family:system-ui,sans-serif"); document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 2500); }, 600); } } catch(e){}
})();
